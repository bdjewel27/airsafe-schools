name: AirSafe CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    name: Gitleaks Secret Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-and-test:
    name: Lint Gate, Services & Evals
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 1. Root Quality & Lint Gate (Fail-Closed on any warning)
      - name: Strict TypeScript & ESLint Gate
        run: |
          npm ci
          npm run lint -- --max-warnings 0

      # 2. Simulator Tests
      - name: Test Simulator
        working-directory: simulator
        run: |
          npm ci
          npm test
          npm run build

      # 3. Poller Tests
      - name: Test Poller Service
        working-directory: services/poller
        run: |
          npm ci
          npm test
          npm run build

      # 4. REST API Tests
      - name: Test REST API Service
        working-directory: services/api
        run: |
          npm ci
          npm test
          npm run build

      # 5. MCP Service Tests
      - name: Test MCP Server
        working-directory: services/mcp
        run: |
          npm ci
          npm run build
          npm test

      # 6. Root MCP & Shared Tool Library Tests
      - name: Test Shared MCP Tool Library
        working-directory: mcp
        run: |
          npm ci
          npm run build
          npm test

      # 7. AI Decision & Policy Golden Evals
      - name: Run AI Golden Evaluation Benchmark
        run: node evals/run-evals.js

  infra-synth:
    name: CDK Infrastructure Synth
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install CDK Dependencies
        working-directory: infra
        run: npm ci

      - name: Synthesize CDK Templates
        working-directory: infra
        run: npx cdk synth
